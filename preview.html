<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- This policy is inherited by user content. Script restrictions belong to the editor. -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Pages Online preview host</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="preview-content" title="User-created page" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
  <script src="src/preview-host.js"></script>
</body>
</html>
