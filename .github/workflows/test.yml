name: Test Pages Online
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.3.3
      contract-config: testing-contract.config.mjs
      server-command: node vendor/fragment-kit-v0.3.3/tools/serve.mjs --port 8000
      browser-command: node tests/browser/legacy-publish.cjs && node tests/browser/url-state.cjs && npm run test:browser
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.3.3
